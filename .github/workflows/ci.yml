name: CI

on:
  push:
    branches: [main, dev-reconciliation-v1]
  pull_request:
    branches: [main, dev-reconciliation-v1]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test preserved V1 benchmark
        run: python scripts/run_benchmark.py --transactions 1000 --output-dir artifacts/ci_benchmark
      - name: Smoke-test truth-blind SQL operations
        run: python scripts/run_operations.py --input-dir artifacts/ci_benchmark/data --as-of 2026-02-10 --output-dir artifacts/ci_phase2
      - name: Retain reviewable management report
        uses: actions/upload-artifact@v4
        with:
          name: operational-report-python-${{ matrix.python-version }}
          path: artifacts/ci_phase2/
          retention-days: 7
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-demo.txt -c constraints.txt
      - run: python scripts/check_notebook.py
